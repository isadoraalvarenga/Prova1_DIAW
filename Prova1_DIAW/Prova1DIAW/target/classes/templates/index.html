<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}"> 
    <title>Candidatos STE</title>
</head>
<body>

    <form method="get" th:action="@{/Candidatos}" class="filtros"> </form>
    <div class="card" th:each="cand : ${candidatos}">

    <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}" 
        th:alt="${cand.nomeUrna}" class="foto-candidato">
    </div>
    
</body>
</html>
